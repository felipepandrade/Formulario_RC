name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # E-mails fictícios (Base64 de ci@example.com) só para o build passar no CI.
      VITE_EMAIL_CATU_OI: Y2lAZXhhbXBsZS5jb20=
      VITE_EMAIL_CAMACARI_OI: Y2lAZXhhbXBsZS5jb20=
      VITE_EMAIL_ITABUNA_OI: Y2lAZXhhbXBsZS5jb20=
      VITE_EMAIL_PILAR_OI: Y2lAZXhhbXBsZS5jb20=
      VITE_EMAIL_ATALAIA_OI: Y2lAZXhhbXBsZS5jb20=
      VITE_EMAIL_R_CATU_OI: Y2lAZXhhbXBsZS5jb20=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rodar testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar o Chromium para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Guardar o relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
