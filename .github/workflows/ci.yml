name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # E-mails fictícios (Base64 de ci@example.com) só para o build passar no CI.
          VITE_EMAIL_CATU_OI: Y2lAZXhhbXBsZS5jb20=
          VITE_EMAIL_CAMACARI_OI: Y2lAZXhhbXBsZS5jb20=
          VITE_EMAIL_ITABUNA_OI: Y2lAZXhhbXBsZS5jb20=
          VITE_EMAIL_PILAR_OI: Y2lAZXhhbXBsZS5jb20=
          VITE_EMAIL_ATALAIA_OI: Y2lAZXhhbXBsZS5jb20=
          VITE_EMAIL_R_CATU_OI: Y2lAZXhhbXBsZS5jb20=
